services:
  - type: web
    name: iipmp-portal
    env: python
    region: singapore
    plan: starter # Paid tier always-on plan to eliminate cold starts
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn project_monitoring.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --threads 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "False"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: iipmp-postgres-db
          property: connectionString

databases:
  - name: iipmp-postgres-db
    plan: starter # Paid tier PostgreSQL instance
    region: singapore
    databaseName: iipmp
    user: iipmp_user

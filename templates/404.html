{% extends 'base.html' %}
{% load static %}

{% block title %}404 Page Not Found - IIPMP{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center align-items-center" style="min-height: 60vh;">
        <div class="col-md-8 col-lg-6">
            <h1 class="display-1 fw-bold text-muted" style="font-size: 8rem; color: #e9ecef !important;">404</h1>
            <h2 class="fw-bold mb-3" style="color: #003366;">Page Not Found</h2>
            <p class="text-muted lead mb-5">The page you are looking for does not exist, has been moved, or is temporarily unavailable.</p>
            
            <div class="d-flex justify-content-center gap-3">
                <button onclick="window.history.back()" class="btn btn-outline-secondary px-4"><i class="fa-solid fa-arrow-left me-2"></i>Go Back</button>
                <a href="{% url 'home' %}" class="btn btn-primary px-4" style="background-color: #003366;"><i class="fa-solid fa-home me-2"></i>Go to Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

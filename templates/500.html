{% extends 'base.html' %}
{% load static %}

{% block title %}500 Server Error - IIPMP{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center align-items-center" style="min-height: 60vh;">
        <div class="col-md-8 col-lg-6">
            <h1 class="display-1 fw-bold text-muted" style="font-size: 8rem; color: #e9ecef !important;">500</h1>
            <h2 class="fw-bold mb-3 text-danger">Internal Server Error</h2>
            <p class="text-muted lead mb-5">Oops! Something went wrong on our end. Our technical team has been notified. Please try again later.</p>
            
            <div class="d-flex justify-content-center gap-3">
                <button onclick="window.location.reload()" class="btn btn-outline-secondary px-4"><i class="fa-solid fa-rotate-right me-2"></i>Try Again</button>
                <a href="{% url 'home' %}" class="btn btn-primary px-4" style="background-color: #003366;"><i class="fa-solid fa-home me-2"></i>Go to Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
